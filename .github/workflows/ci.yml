name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Lint and format check
        run: python scripts/ci_checks.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke benchmark
        run: >-
          python -m contextopt benchmark
          --instances 5
          --items 10
          --critical 3
          --budget 800
          --seed 42
      - name: Smoke semantic-memory evaluation
        run: >-
          python -m contextopt memory-eval
          --repetitions 2
          --limit 3
      - name: Smoke semantic-context evaluation
        run: >-
          python -m contextopt semantic-context-eval
          --repetitions 2
          --budgets 128,512

  docker-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Execute Docker candidate smoke
        run: >-
          python -m unittest
          tests.test_branch_executor.BranchExecutorTests.test_docker_sandbox_executes_candidate_on_enabled_runner
          -v
