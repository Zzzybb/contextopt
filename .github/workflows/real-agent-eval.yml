name: real-agent-eval

on:
  workflow_dispatch:
    inputs:
      model:
        description: "OpenAI-compatible model identifier"
        required: true
        type: string
      base_url:
        description: "OpenAI-compatible API base URL"
        required: true
        default: "https://api.openai.com/v1"
        type: string
      planner_model:
        description: "Optional model override for the planner role"
        required: false
        default: ""
        type: string
      solver_model:
        description: "Optional model override for the solver role"
        required: false
        default: ""
        type: string
      reviewer_model:
        description: "Optional model override for the reviewer role"
        required: false
        default: ""
        type: string
      cancellation_url:
        description: "Optional provider-specific POST endpoint for remote cancellation"
        required: false
        default: ""
        type: string
      sandbox:
        description: "Candidate grader sandbox: host or docker"
        required: true
        default: "host"
        type: choice
        options:
          - host
          - docker
      container_image:
        description: "Docker image when sandbox=docker (pin a digest for serious runs)"
        required: true
        default: "python:3.12-slim"
        type: string
      repetitions:
        description: "Paired repetitions (3 is the default minimum)"
        required: true
        default: "3"
        type: string
      fixtures:
        description: "Fixture selection: all, two-sum, extended-gcd, merge-intervals, modular-inverse, or comma-separated"
        required: true
        default: "all"
        type: string
      strategies:
        description: "Comma-separated strategies"
        required: true
        default: "single_pass,best_of_n,orchestrated"
        type: string

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CONTEXTOPT_GIT_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Validate provider secret
        shell: bash
        env:
          CONTEXTOPT_API_KEY: ${{ secrets.CONTEXTOPT_API_KEY }}
        run: test -n "$CONTEXTOPT_API_KEY"
      - name: Validate fixed-matrix repetition count
        shell: bash
        env:
          EVAL_REPETITIONS: ${{ inputs.repetitions }}
        run: |
          if ! [[ "$EVAL_REPETITIONS" =~ ^[0-9]+$ ]] || (( EVAL_REPETITIONS < 3 )); then
            echo "repetitions must be an integer >= 3 for the real-provider matrix"
            exit 1
          fi
      - name: Run paired real-provider matrix
        env:
          EVAL_MODEL: ${{ inputs.model }}
          EVAL_BASE_URL: ${{ inputs.base_url }}
          EVAL_PLANNER_MODEL: ${{ inputs.planner_model }}
          EVAL_SOLVER_MODEL: ${{ inputs.solver_model }}
          EVAL_REVIEWER_MODEL: ${{ inputs.reviewer_model }}
          EVAL_CANCELLATION_URL: ${{ inputs.cancellation_url }}
          EVAL_SANDBOX: ${{ inputs.sandbox }}
          EVAL_CONTAINER_IMAGE: ${{ inputs.container_image }}
          EVAL_FIXTURES: ${{ inputs.fixtures }}
          EVAL_STRATEGIES: ${{ inputs.strategies }}
          EVAL_REPETITIONS: ${{ inputs.repetitions }}
          CONTEXTOPT_API_KEY: ${{ secrets.CONTEXTOPT_API_KEY }}
        run: |
          args=(
            -m contextopt agent-eval
            --model "$EVAL_MODEL"
            --base-url "$EVAL_BASE_URL"
            --api-key-env CONTEXTOPT_API_KEY
            --fixtures "$EVAL_FIXTURES"
            --strategies "$EVAL_STRATEGIES"
            --repetitions "$EVAL_REPETITIONS"
            --output artifacts/agent-eval-real.json
            --markdown artifacts/agent-eval-real.md
            --html artifacts/agent-eval-real.html
            --checkpoint artifacts/agent-eval-real.checkpoint.json
            --manifest artifacts/agent-eval-real.manifest.json
            --sandbox "$EVAL_SANDBOX"
            --container-image "$EVAL_CONTAINER_IMAGE"
          )
          if [[ -n "$EVAL_CANCELLATION_URL" ]]; then
            args+=(--cancellation-url "$EVAL_CANCELLATION_URL")
          fi
          if [[ -n "$EVAL_PLANNER_MODEL" ]]; then
            args+=(--planner-model "$EVAL_PLANNER_MODEL")
          fi
          if [[ -n "$EVAL_SOLVER_MODEL" ]]; then
            args+=(--solver-model "$EVAL_SOLVER_MODEL")
          fi
          if [[ -n "$EVAL_REVIEWER_MODEL" ]]; then
            args+=(--reviewer-model "$EVAL_REVIEWER_MODEL")
          fi
          python "${args[@]}"
      - name: Upload evaluation ledger
        uses: actions/upload-artifact@v4
        with:
          name: contextopt-real-agent-eval-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
