name: real-agent-model-matrix

on:
  workflow_dispatch:
    inputs:
      models:
        description: "JSON array with at least two objects: [{\"label\":\"model-a\",\"model\":\"...\"}, ...]"
        required: true
        default: '[{"label":"model-a","model":"gpt-4o-mini"},{"label":"model-b","model":"gpt-4.1-mini"}]'
        type: string
      base_url:
        description: "OpenAI-compatible API base URL shared by all models"
        required: true
        default: "https://api.openai.com/v1"
        type: string
      planner_model:
        description: "Optional planner model override shared by all matrix cells"
        required: false
        default: ""
        type: string
      solver_model:
        description: "Optional solver model override shared by all matrix cells"
        required: false
        default: ""
        type: string
      reviewer_model:
        description: "Optional reviewer model override shared by all matrix cells"
        required: false
        default: ""
        type: string
      cancellation_url:
        description: "Optional provider-specific POST endpoint for remote cancellation"
        required: false
        default: ""
        type: string
      sandbox:
        description: "Candidate grader sandbox: host or docker"
        required: true
        default: "host"
        type: choice
        options:
          - host
          - docker
      container_image:
        description: "Docker image when sandbox=docker (pin a digest for serious runs)"
        required: true
        default: "python:3.12-slim"
        type: string
      repetitions:
        description: "Paired repetitions (3 is the default minimum)"
        required: true
        default: "3"
        type: string
      fixtures:
        description: "Fixture selection: all, two-sum, extended-gcd, merge-intervals, modular-inverse, or comma-separated"
        required: true
        default: "all"
        type: string
      strategies:
        description: "Comma-separated strategies"
        required: true
        default: "single_pass,best_of_n,orchestrated"
        type: string

permissions:
  contents: read

concurrency:
  group: real-agent-model-matrix-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.validate.outputs.matrix }}
    steps:
      - name: Validate model matrix input
        id: validate
        shell: bash
        env:
          MODELS_JSON: ${{ inputs.models }}
          EVAL_REPETITIONS: ${{ inputs.repetitions }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re

          raw = os.environ["MODELS_JSON"]
          try:
              models = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"models must be valid JSON: {exc}")
          if not isinstance(models, list) or len(models) < 2:
              raise SystemExit("models must be a JSON array with at least two entries")

          label_pattern = re.compile(r"[A-Za-z0-9][A-Za-z0-9_.-]{0,63}")
          seen: set[str] = set()
          normalized: list[dict[str, str]] = []
          for index, item in enumerate(models):
              if not isinstance(item, dict):
                  raise SystemExit(f"models[{index}] must be an object")
              label = item.get("label")
              model = item.get("model")
              if not isinstance(label, str) or not label_pattern.fullmatch(label):
                  raise SystemExit(
                      f"models[{index}].label must match [A-Za-z0-9][A-Za-z0-9_.-]{{0,63}}"
                  )
              if label in seen:
                  raise SystemExit(f"duplicate model label: {label}")
              if not isinstance(model, str) or not model.strip() or "\n" in model:
                  raise SystemExit(f"models[{index}].model must be a non-empty one-line string")
              seen.add(label)
              normalized.append({"label": label, "model": model.strip()})

          repetitions = os.environ["EVAL_REPETITIONS"]
          if not repetitions.isdigit() or int(repetitions) < 3:
              raise SystemExit("repetitions must be an integer >= 3 for the real-provider matrix")

          matrix = json.dumps({"include": normalized}, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={matrix}\n")
          PY

  evaluate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      CONTEXTOPT_GIT_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Validate provider secret
        shell: bash
        env:
          CONTEXTOPT_API_KEY: ${{ secrets.CONTEXTOPT_API_KEY }}
        run: test -n "$CONTEXTOPT_API_KEY"
      - name: Run paired real-provider bundle
        shell: bash
        env:
          EVAL_LABEL: ${{ matrix.label }}
          EVAL_MODEL: ${{ matrix.model }}
          EVAL_BASE_URL: ${{ inputs.base_url }}
          EVAL_PLANNER_MODEL: ${{ inputs.planner_model }}
          EVAL_SOLVER_MODEL: ${{ inputs.solver_model }}
          EVAL_REVIEWER_MODEL: ${{ inputs.reviewer_model }}
          EVAL_CANCELLATION_URL: ${{ inputs.cancellation_url }}
          EVAL_SANDBOX: ${{ inputs.sandbox }}
          EVAL_CONTAINER_IMAGE: ${{ inputs.container_image }}
          EVAL_FIXTURES: ${{ inputs.fixtures }}
          EVAL_STRATEGIES: ${{ inputs.strategies }}
          EVAL_REPETITIONS: ${{ inputs.repetitions }}
          CONTEXTOPT_API_KEY: ${{ secrets.CONTEXTOPT_API_KEY }}
        run: |
          set -euo pipefail
          bundle="artifacts/${EVAL_LABEL}"
          mkdir -p "$bundle"
          args=(
            -m contextopt agent-eval
            --model "$EVAL_MODEL"
            --base-url "$EVAL_BASE_URL"
            --api-key-env CONTEXTOPT_API_KEY
            --fixtures "$EVAL_FIXTURES"
            --strategies "$EVAL_STRATEGIES"
            --repetitions "$EVAL_REPETITIONS"
            --output "$bundle/agent-eval.json"
            --markdown "$bundle/agent-eval.md"
            --html "$bundle/agent-eval.html"
            --checkpoint "$bundle/agent-eval.checkpoint.json"
            --manifest "$bundle/agent-eval.manifest.json"
            --record-transcript-dir "$bundle/transcript"
            --sandbox "$EVAL_SANDBOX"
            --container-image "$EVAL_CONTAINER_IMAGE"
          )
          if [[ -n "$EVAL_CANCELLATION_URL" ]]; then
            args+=(--cancellation-url "$EVAL_CANCELLATION_URL")
          fi
          if [[ -n "$EVAL_PLANNER_MODEL" ]]; then
            args+=(--planner-model "$EVAL_PLANNER_MODEL")
          fi
          if [[ -n "$EVAL_SOLVER_MODEL" ]]; then
            args+=(--solver-model "$EVAL_SOLVER_MODEL")
          fi
          if [[ -n "$EVAL_REVIEWER_MODEL" ]]; then
            args+=(--reviewer-model "$EVAL_REVIEWER_MODEL")
          fi
          python "${args[@]}"
      - name: Upload model bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contextopt-model-${{ matrix.label }}
          path: artifacts/${{ matrix.label }}/
          if-no-files-found: warn

  compare:
    needs: evaluate
    if: ${{ needs.evaluate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Download model bundles
        uses: actions/download-artifact@v4
        with:
          pattern: contextopt-model-*
          path: artifacts/models
          merge-multiple: false
      - name: Build matched model comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/matrix
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          root = Path("artifacts/models")
          args = [
              sys.executable,
              "-m",
              "contextopt",
              "agent-eval-compare",
              "--output",
              "artifacts/matrix/model-matrix.json",
              "--markdown",
              "artifacts/matrix/model-matrix.md",
              "--html",
              "artifacts/matrix/model-matrix.html",
          ]
          directories = sorted(
              path for path in root.glob("contextopt-model-*") if path.is_dir()
          )
          if len(directories) < 2:
              raise SystemExit("at least two downloaded model bundles are required")
          for directory in directories:
              label = directory.name.removeprefix("contextopt-model-")
              report = directory / "agent-eval.json"
              manifest = directory / "agent-eval.manifest.json"
              if not report.is_file() or not manifest.is_file():
                  raise SystemExit(f"incomplete model bundle: {directory}")
              args.extend(("--bundle", label, str(report), str(manifest)))
          subprocess.run(args, check=True)
          PY
      - name: Upload matched model matrix
        uses: actions/upload-artifact@v4
        with:
          name: contextopt-model-matrix-${{ github.run_id }}
          path: artifacts/matrix/
          if-no-files-found: error
